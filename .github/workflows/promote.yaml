name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Image SHA to promote (leave blank to use current beta)'
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve SHA
        id: sha
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> $GITHUB_OUTPUT
          else
            BETA_SHA=$(grep 'newTag:' k8s/overlays/beta/kustomization.yaml | head -1 | sed "s/.*newTag: \"\(.*\)\"/\1/")
            echo "sha=$BETA_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Update prod overlay image tags
        run: |
          sed -i "s|newTag: .*|newTag: \"${{ steps.sha.outputs.sha }}\"|g" k8s/overlays/prod/kustomization.yaml

      - name: Open and merge promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest change — nothing to promote."
            exit 0
          fi
          BRANCH="promote/$SHA"
          TITLE="chore: promote $SHA to prod [skip ci]"
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          # main requires a PR; create one and squash-merge it (0 approvals/checks required).
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Automated prod promotion of \`$SHA\`."
          gh pr merge "$BRANCH" --squash --admin --delete-branch

      - name: Summary
        run: |
          echo "### Promoted to prod" >> $GITHUB_STEP_SUMMARY
          echo "Image SHA: \`${{ steps.sha.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
